name: validate-bopen-architecture-skill

on:
  pull_request:
    paths:
      - 'bopen-architecture/**'
  push:
    paths:
      - 'bopen-architecture/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bopen-architecture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_package.py
      - run: python -m unittest discover -s tests -v
      - run: mkdir -p ../authorized-evidence && python scripts/run_static_evals.py --output-dir ../authorized-evidence --output static-eval-report.json
