apiVersion: skills.bopen.io/v1alpha1
kind: Skill
metadata:
  id: io.bizera.bopen.adr.governance
  name: bopen-adr-governance
  version: 0.1.0
  owner: bopen-architecture-authority
  classification: internal
  license: Internal-Evaluation
  sourceRepository: bstBizEra/bOPEN
  sourceRevision: UNCOMMITTED-CANDIDATE
  lifecycle: CANDIDATE
spec:
  type: analytical
  riskClass: SKR1
  category: engineering
  scope:
    allowed:
    - platform
    - product
    - tenant
    - workspace
    - repository
    tenantContext: not-applicable
  contracts:
    inputSchema: schemas/input.schema.json
    outputSchema: schemas/output.schema.json
  requires:
    capabilities: []
    tools:
    - id: repository
      operations:
      - read
      - search
  runtime:
    sandboxProfile: bopen-standard
    networkPolicy: deny
    filesystemPolicy: repository-worktree
    maxDuration: PT15M
    maxSteps: 40
    maxToolCalls: 30
  approval:
    mode: none
    requiredFor: []
  data:
    maximumClassification: confidential
    crossTenantAccess: prohibited
    secretsInPackage: prohibited
  failure:
    retryPolicy: bounded
    compensationRequired: false
  evaluation:
    suite: evals/cases.yaml
    minimumStaticPassRate: 1.0
    crossTenantFailuresAllowed: 0
    modelEvaluationRequired: true
  provenance:
    digestBound: true
    signatureRequiredForPublication: true
    sbomRequired: true
