name: validate-bopen-schema-diff
on:
  pull_request:
    paths:
      - '.agents/skills/bopen-schema-diff/**'
  push:
    paths:
      - '.agents/skills/bopen-schema-diff/**'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r .agents/skills/bopen-schema-diff/requirements.txt
      - run: python .agents/skills/bopen-schema-diff/scripts/validate_package.py
      - run: python -m unittest discover -s .agents/skills/bopen-schema-diff/tests -v
      - run: python .agents/skills/bopen-schema-diff/scripts/run_static_evals.py
