name: validate-bopen-schema-diff-gitea
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r .agents/skills/bopen-schema-diff/requirements.txt
      - run: make -C .agents/skills/bopen-schema-diff verify
