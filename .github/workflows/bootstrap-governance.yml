name: Bootstrap Governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # The governance suite (tests/governance/test_governance_validators.py)
    # drives tools that need full git history (ballot attribution via
    # git blame), jsonschema (contract conformance), and a configured
    # database — the conformance tool refuses a verdict when canonical tests
    # skip. Credentials are CI-throwaway values, non-production by
    # declaration (BOPEN_DB_NON_PRODUCTION=1).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BOPEN_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres
      BOPEN_DATABASE_URL: postgresql://bopen_app:bopen_local_dev@127.0.0.1:5433/bopen_dev
      BOPEN_APP_PASSWORD: bopen_local_dev
      BOPEN_DB_NON_PRODUCTION: "1"
      BOPEN_ALLOW_UNAUTHENTICATED_IDENTITY_ASSERTION: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Bootstrap the database (role, schema, migrations)
        run: python tools/db_bootstrap.py --apply
      - name: Generate a development signing key (CI-ephemeral, never committed)
        run: >
          python tools/generate_token_key.py
          | sed -n 's/^BOPEN_CONTEXT_TOKEN_KEY="\(.*\)"$/BOPEN_CONTEXT_TOKEN_KEY=\1/p'
          >> "$GITHUB_ENV"
      - name: Validate repository governance
        run: python tools/validate_repository.py
      - name: Run governance tests
        run: python -m unittest discover -s tests/governance -p 'test_*.py'
