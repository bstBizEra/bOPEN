name: Bootstrap Governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned skill validation dependencies
        run: python -m pip install -r .agents/requirements.lock
      - name: Validate repository governance
        run: python tools/validate_repository.py
      - name: Validate shared skill registry
        run: python tools/validate_skill_registry.py
      - name: Run governance tests
        run: python -m unittest discover -s tests/governance -p 'test_*.py'
      - name: Run all skill package checks
        run: python tools/run_skill_package_tests.py
