# Packaging for the bOPEN kernel invariants.
#
# Work package: BOPEN-WP-PKG-KERNEL-001
#
# WHY THIS EXISTS
#
# Nothing in this repository was installable. `tools/run_tests.py` compensates by inserting four
# paths into `sys.path` before discovery, and every other consumer has to reproduce that list by
# hand, in the right order, with no artifact declaring it. The 2026-08-11 field check recorded that
# as the packaging gap behind objective criterion 5 ("runs without a hand-assembled PYTHONPATH"),
# which no component satisfied.
#
# This is the first component to declare itself. `kernel_core` is chosen first because it imports
# nothing outside the standard library, so its metadata can be trusted without resolving anything.
#
# WHAT IT DOES NOT DO
#
# It does not remove the `sys.path` inserts in `tools/run_tests.py`. Removing them is a change to
# how the canonical suite is discovered, and it should follow evidence that installed imports work
# in CI rather than accompany the first packaging file. Both paths work today; only one of them is
# declared.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bopen-kernel-core"
version = "0.1.0"
description = "bOPEN kernel invariants: capability, entitlement, audit, identity and context types"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Deliberately empty. Every module under `kernel_core` imports only the standard library, verified
# by scanning top-level imports across the package. A dependency listed here that the code does not
# use is a false statement in the one file a consumer trusts to be true.
dependencies = []

[tool.setuptools]
packages = ["kernel_core"]
